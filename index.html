<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doujin Pop</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  background:#bfe9ff;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  overflow:hidden;
}

h1{
  font-size:70px;
  margin-bottom:10px;
}

#score{
  font-size:80px;
  font-weight:bold;
  margin-bottom:20px;
}

#friend{
  width:350px;
  border-radius:20px;
  cursor:pointer;
  transition:0.1s;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  user-select:none;
  -webkit-user-drag:none;
}

.pop{
  position:absolute;
  font-size:40px;
  font-weight:bold;
  color:#ff1493;
  animation:float .6s forwards;
  pointer-events:none;
}

@keyframes float{

  0%{
    opacity:1;
    transform:translateY(0);
  }

  100%{
    opacity:0;
    transform:translateY(-80px);
  }

}

</style>
</head>
<body>

<h1>DOUJIN POP</h1>

<div id="score">0</div>

<!-- รูปปากปิด -->
<img src="friend-close.jpg" id="friend">

<script>

let score = 0;

const friend = document.getElementById("friend");
const scoreEl = document.getElementById("score");

function pop(x,y){

  score++;
  scoreEl.innerText = score;

  // รูปอ้าปาก
  friend.src = "friend-open.png";

  // เด้งเหมือน Popcat
  friend.style.transform = "scale(0.95)";

  setTimeout(()=>{
    friend.style.transform = "scale(1)";
  },100);

  // เสียง POP
  const ctx = new(window.AudioContext || window.webkitAudioContext)();

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "square";
  osc.frequency.value = 300;

  gain.gain.value = 0.1;

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();

  osc.frequency.exponentialRampToValueAtTime(
    600,
    ctx.currentTime + 0.05
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    ctx.currentTime + 0.08
  );

  osc.stop(ctx.currentTime + 0.08);

  // POP TEXT
  const text = document.createElement("div");

  text.className = "pop";
  text.innerText = "POP!";

  text.style.left = x + "px";
  text.style.top = y + "px";

  document.body.appendChild(text);

  setTimeout(()=>{
    text.remove();
  },600);

  // กลับเป็นรูปปิด
  setTimeout(()=>{
    friend.src = "friend-close.jpg";
  },300);

}

friend.addEventListener("click",(e)=>{
  pop(e.clientX,e.clientY);
});

window.addEventListener("keydown",(e)=>{
  if(e.code === "Space"){
    pop(window.innerWidth/2,window.innerHeight/2);
  }
});

</script>

</body>
</html>
