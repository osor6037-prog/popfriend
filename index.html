<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doujin Pop</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  background:#bfe9ff;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

h1{
  font-size:60px;
  margin-bottom:10px;
}

#score{
  font-size:80px;
  font-weight:bold;
  margin-bottom:20px;
}

#friend{
  width:350px;
  border-radius:20px;
  cursor:pointer;
  transition:.05s;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

#friend:active{
  transform:scale(.97);
}

</style>
</head>
<body>

<h1>DOUJIN POP</h1>

<div id="score">0</div>

<img src="friend-close.jpg" id="friend">

<script>

let score = 0;

const friend = document.getElementById("friend");
const scoreEl = document.getElementById("score");

function pop(){

  score++;
  scoreEl.innerText = score;

  // เปลี่ยนเป็นรูปอ้าปาก
  friend.src = "friend-open.jpg";

  // เสียง POP
  const ctx = new(window.AudioContext || window.webkitAudioContext)();

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "square";
  osc.frequency.value = 300;

  gain.gain.value = 0.1;

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();

  osc.frequency.exponentialRampToValueAtTime(
    600,
    ctx.currentTime + 0.05
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    ctx.currentTime + 0.08
  );

  osc.stop(ctx.currentTime + 0.08);

  // กลับเป็นปากปิด
  setTimeout(()=>{
    friend.src = "friend-close.jpg";
  },80);

}

friend.addEventListener("click", pop);

window.addEventListener("keydown",(e)=>{
  if(e.code === "Space"){
    pop();
  }
});

</script>

</body>
</html>
